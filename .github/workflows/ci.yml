name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SystemOneSharp.slnx
      - name: Build
        run: dotnet build SystemOneSharp.slnx -c Release --no-restore
      - name: Verify client
        run: dotnet run --project tests/SystemOneSharp.Verification -c Release --no-build
      - name: Pack library
        run: dotnet pack src/SystemOneSharp/SystemOneSharp.csproj -c Release --no-build --no-restore
