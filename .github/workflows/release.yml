name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Check tag matches project version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SystemOneSharp/SystemOneSharp.csproj)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: dotnet build SystemOneSharp.slnx -c Release
      - run: dotnet run --project tests/SystemOneSharp.Verification -c Release --no-build
      - run: dotnet pack src/SystemOneSharp/SystemOneSharp.csproj -c Release --no-build -o artifacts
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
